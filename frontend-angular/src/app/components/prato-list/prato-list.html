<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Cardápio</h2>
    <a routerLink="/pratos/novo" class="btn btn-success">+ Novo Prato</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Categoria</th>
        <th>Preço</th>
        <th>Disponível</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let prato of pratos">
        <td>{{ prato.nome }}</td>
        <td>{{ prato.descricao }}</td>
        <td>{{ prato.categoria }}</td>
        <td>R$ {{ prato.preco | number:'1.2-2' }}</td>
        <td>
          <span [class]="prato.disponivel ? 'badge bg-success' : 'badge bg-danger'">
            {{ prato.disponivel ? 'Sim' : 'Não' }}
          </span>
        </td>
        <td>
          <a [routerLink]="['/pratos/editar', prato.id]" class="btn btn-sm btn-warning me-2">Editar</a>
          <button (click)="excluir(prato.id)" class="btn btn-sm btn-danger">Excluir</button>
        </td>
      </tr>
      <tr *ngIf="pratos.length === 0">
        <td colspan="6" class="text-center text-muted">Nenhum prato cadastrado.</td>
      </tr>
    </tbody>
  </table>
</div>
